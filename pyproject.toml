[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiosub"
version = "0.5.0"
description = "A command-line tool for generating subtitles from audio file using Qwen3-ASR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fire>=0.7.0",
    "mlx-qwen3-asr>=0.4.0",
]

[project.scripts]
audiosub = "audiosub:main"

[project.urls]
Homepage = "https://github.com/huccihuang/audiosub"
Repository = "https://github.com/huccihuang/audiosub"
