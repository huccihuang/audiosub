[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiosub"
version = "0.4.0"
description = "A command-line tool for generating subtitles from audio file using SenseVoice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fire>=0.7.0",
    "sherpa-onnx>=1.12",
    "onnxruntime>=1.22",
    "numpy>=1.26",
]

[project.scripts]
audiosub = "audiosub:main"

[project.urls]
Homepage = "https://github.com/huccihuang/audiosub"
Repository = "https://github.com/huccihuang/audiosub"
